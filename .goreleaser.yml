version: 2

project_name: zenith

before:
  hooks:
    - go mod tidy

builds:
  - id: zenith
    main: ./cmd/zenith
    binary: zenith
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    builds: [zenith]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Storage Engine
      regexp: "^storage"
    - title: Other
      regexp: ".*"

release:
  draft: false
  prerelease: auto
  name_template: "ZENITH v{{.Version}}"
  header: |
    ## ZENITH v{{.Version}}

    Local-first hybrid search engine — LSM storage, BK-tree fuzzy, RRF ranking, automatic embedding via nerve or Ollama.

  footer: |
    ---

    **Quick install:**

    ```bash
    # macOS / Linux
    curl -L https://github.com/shramanb113/ZENITH/releases/download/v{{.Version}}/zenith_{{.Version}}_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz | tar xz
    sudo mv zenith /usr/local/bin/

    # Go install
    go install github.com/shramanb113/ZENITH/cmd/zenith@v{{.Version}}
    ```

    See README for [embedder setup](https://github.com/shramanb113/ZENITH#embedder-backends) — works standalone with deterministic embeddings, or add Ollama / Python for full semantic search.
